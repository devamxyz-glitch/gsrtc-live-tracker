<style>
/* ============================================================
   BOOT SPLASH
   ============================================================ */

#splash {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background: #1b3c77;
  background:
    radial-gradient(
      118% 78% at 50% 16%,
      #2d5fae 0%,
      #1e4181 46%,
      #142f5d 100%
    );

  color: #fff;

  animation: splash-out .4s ease 3.5s forwards;
}

#splash .s-mark {
  width: 104px;
  height: 104px;

  filter: drop-shadow(0 14px 34px rgba(0, 0, 0, .34));

  animation:
    splash-mark .62s cubic-bezier(.18, .9, .24, 1) both;
}

#splash .s-name {
  margin-top: 22px;

  font:
    700 23px/1.2
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;

  letter-spacing: -.3px;

  animation:
    splash-up .5s cubic-bezier(.2, .8, .2, 1) .14s both;
}

#splash .s-sub {
  margin-top: 7px;

  font:
    500 13.5px/1.2
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;

  color: rgba(255, 255, 255, .62);

  animation:
    splash-up .5s cubic-bezier(.2, .8, .2, 1) .22s both;
}

#splash .s-founder {
  margin-top: 12px;

  font:
    650 11.5px/1.35
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;

  letter-spacing: .45px;

  color: rgba(255, 255, 255, .91);

  animation:
    splash-up .5s cubic-bezier(.2, .8, .2, 1) .30s both;
}

#splash .s-founder span {
  color: #f4ad52;
  margin: 0 4px;
}

#splash .s-contact {
  margin-top: 6px;

  font:
    500 10px/1.35
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;

  letter-spacing: .25px;

  color: rgba(255, 255, 255, .58);

  animation:
    splash-up .5s cubic-bezier(.2, .8, .2, 1) .38s both;
}

#splash .s-load {
  position: relative;
  overflow: hidden;

  width: 104px;
  height: 3px;

  margin-top: 30px;

  border-radius: 3px;
  background: rgba(255, 255, 255, .17);

  animation: splash-up .5s ease .42s both;
}

#splash .s-load::after {
  content: '';

  position: absolute;
  inset: 0;

  border-radius: 3px;

  background: rgba(255, 255, 255, .85);

  animation:
    splash-sweep 1.15s cubic-bezier(.5, 0, .5, 1) infinite;
}

#splash.done {
  animation: splash-out .3s ease forwards;
}

@keyframes splash-mark {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.86);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes splash-up {
  from {
    opacity: 0;
    transform: translateY(9px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes splash-sweep {
  0% {
    transform: translateX(-100%) scaleX(.45);
  }

  100% {
    transform: translateX(100%) scaleX(.45);
  }
}

@keyframes splash-out {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

@media (prefers-reduced-motion: reduce) {
  #splash,
  #splash * {
    animation-duration: .001ms !important;
    animation-delay: 0s !important;
  }

  #splash .s-load {
    display: none;
  }
}
</style>
